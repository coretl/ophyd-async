name: diag-ubuntu-2604
on:
  workflow_dispatch:
  push:

jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
        submodule: [new, old]
        exclude:
          - os: ubuntu-24.04
            submodule: old
    runs-on: ${{ matrix.os }}
    env:
      EXAMPLE_SERVICES_PATH: ./example-services
      PY_IGNORE_IMPORTMISMATCH: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: example-services-bump
          submodules: recursive
          fetch-depth: 0

      - name: Use the old submodule
        if: matrix.submodule == 'old'
        run: git -C example-services checkout 3c0274b244d28bc6e197f9e3610355cc7c0cc5d3

      - name: Versions
        run: |
          cat /etc/os-release | head -3
          docker compose version
          git -C example-services log --oneline -1
          git log --oneline -1

      - uses: astral-sh/setup-uv@v10.0.0

      - name: Run container tests
        run: uv run --locked tox -e tests -- --durations=20 tests/container_tests
